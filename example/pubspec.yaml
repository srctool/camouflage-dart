name: camouflage_example
description: "The Camouflage example app, on all six platforms."
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  camouflage_core: ^0.1.0-dev.1
  camouflage_skin_minimal: ^0.1.0-dev.1
  camouflage_skin_fluent: ^0.1.0-dev.1
  intl: ^0.20.2           # date and time names for every locale: initializeDateFormatting (CamoDatePicker)
  flutter_svg: ^2.3.0   # the AppIcon pattern: SVG assets, an app-side dependency (CamoIcon §3)

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/icons/
