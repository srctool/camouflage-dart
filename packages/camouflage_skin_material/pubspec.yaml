name: camouflage_skin_material
description: "The Material 3 skin: Paper surfaces, Ripple feedback and M3 proportions, drawn on widgets with material_ui for the ink."
version: 0.1.1
repository: https://github.com/srctool/camouflage-dart
documentation: https://camouflage.srctool.com
topics:
  - ui
  - design-system
  - theming
  - widgets
  - accessibility
issue_tracker: https://github.com/srctool/camouflage-dart/issues
resolution: workspace

screenshots:
  - description: 'The Material skin, light: a checkout card and selection controls.'
    path: screenshots/light.png
  - description: 'The Material skin, dark.'
    path: screenshots/dark.png

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  camouflage_core: ^0.1.0
  material_ui: ^1.0.0                     # the ink ripple only; this is the one package allowed to depend on it

dev_dependencies:
  alchemist: ^0.14.1                     # screenshot goldens (CI goldens on Linux)
  camouflage_skin_testing: ^0.1.0   # test-only, same layer (ADR-27)
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
