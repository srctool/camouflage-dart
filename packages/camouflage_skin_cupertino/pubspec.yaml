name: camouflage_skin_cupertino
description: "The Cupertino skin: Apple HIG anatomy, blur materials and Liquid Glass, press-fade feedback. Widgets layer only, no Material or Cupertino."
version: 0.1.1
repository: https://github.com/srctool/camouflage-dart
documentation: https://camouflage.srctool.com
topics:
  - ui
  - design-system
  - theming
  - widgets
  - accessibility
issue_tracker: https://github.com/srctool/camouflage-dart/issues
resolution: workspace

screenshots:
  - description: 'The Cupertino skin, light: a checkout card and selection controls.'
    path: screenshots/light.png
  - description: 'The Cupertino skin, dark.'
    path: screenshots/dark.png

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  camouflage_core: ^0.1.0

dev_dependencies:
  alchemist: ^0.14.1                     # screenshot goldens (CI goldens on Linux)
  camouflage_skin_testing: ^0.1.0   # test-only, same layer (ADR-27)
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
