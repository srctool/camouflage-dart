name: camouflage_skin_testing
description: "Test-only checks for any Camouflage skin: renderers apply behavior, and no literals."
version: 0.1.0-dev.1
repository: https://github.com/srctool/camouflage-dart
issue_tracker: https://github.com/srctool/camouflage-dart/issues
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  camouflage_core: ^0.1.0-dev.1
  flutter_test:          # the checks drive a WidgetTester
    sdk: flutter

dev_dependencies:
  camouflage_skin_minimal: ^0.1.0-dev.1   # a real skin to break on purpose; test-only, same layer (ADR-27)
  flutter_lints: ^6.0.0
