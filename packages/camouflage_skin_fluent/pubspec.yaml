name: camouflage_skin_fluent
description: "The Fluent 2 skin, built on widgets: Solid surfaces, Subtle feedback, Fluent's tokens. No Material."
version: 0.1.0-dev.1
repository: https://github.com/srctool/camouflage-dart
issue_tracker: https://github.com/srctool/camouflage-dart/issues
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  camouflage_core: ^0.1.0-dev.1
  material_color_utilities: ^0.13.0   # brand ramps from a custom brand color

dev_dependencies:
  alchemist: ^0.14.1                     # screenshot goldens (CI goldens on Linux)
  camouflage_skin_testing: ^0.1.0-dev.1   # test-only, same layer (ADR-27)
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
