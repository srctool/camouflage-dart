name: CI

# Camouflage for Flutter: analysis, formatting, tests, the layer and no-Material checks, and the example app
# built for all six platforms on every pull request (see the docs: Project Setup and Testing).
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-test:
    name: Analyze, format, test, layers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart pub global activate melos
      - run: flutter pub get
      - run: melos run analyze
      - run: melos run format
      - run: melos run layers
      - run: melos run no-material
      - run: melos run test

  web:
    name: Web (Wasm)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build web --wasm
        working-directory: example

  android:
    name: Android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build apk --debug
        working-directory: example

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - run: flutter build linux
        working-directory: example

  apple:
    name: iOS and macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build ios --no-codesign
        working-directory: example
      - run: flutter build macos
        working-directory: example

  windows:
    name: Windows
    # Its own job, so a Windows-only failure is visible without blocking the others.
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build windows
        working-directory: example
